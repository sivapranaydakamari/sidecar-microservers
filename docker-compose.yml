version: "3.9"

services:

  log-aggregator:
    build: ./log-aggregator
    container_name: log-aggregator
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT}:3001"
    volumes:
      - user_service_logs:/var/log/app
    environment:
      - PORT=${USER_SERVICE_PORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      log-aggregator:
        condition: service_healthy

  user-logging-sidecar:
    build: ./logging-sidecar
    container_name: user-logging-sidecar
    volumes:
      - user_service_logs:/var/log/app:ro
    environment:
      - SERVICE_NAME=user-service
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_AGGREGATOR_URL=${LOG_AGGREGATOR_URL}
    depends_on:
      user-service:
        condition: service_healthy

  user-metrics-sidecar:
    build: ./metrics-sidecar
    container_name: user-metrics-sidecar
    ports:
      - "9101:9100"
    environment:
      - APP_METRICS_URL=http://user-service:3001/metrics
      - SERVICE_NAME=user-service
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=9100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      user-service:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "${PRODUCT_SERVICE_PORT}:3002"
    volumes:
      - product_service_logs:/var/log/app
    environment:
      - PORT=${PRODUCT_SERVICE_PORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      log-aggregator:
        condition: service_healthy

  product-logging-sidecar:
    build: ./logging-sidecar
    container_name: product-logging-sidecar
    volumes:
      - product_service_logs:/var/log/app:ro
    environment:
      - SERVICE_NAME=product-service
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_AGGREGATOR_URL=${LOG_AGGREGATOR_URL}
    depends_on:
      product-service:
        condition: service_healthy

  product-metrics-sidecar:
    build: ./metrics-sidecar
    container_name: product-metrics-sidecar
    ports:
      - "9102:9100"
    environment:
      - APP_METRICS_URL=http://product-service:3002/metrics
      - SERVICE_NAME=product-service
      - ENVIRONMENT=development
      - PORT=9100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      product-service:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT}:3003"
    volumes:
      - order_service_logs:/var/log/app
    environment:
      - PORT=${ORDER_SERVICE_PORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      log-aggregator:
        condition: service_healthy

  order-logging-sidecar:
    build: ./logging-sidecar
    container_name: order-logging-sidecar
    volumes:
      - order_service_logs:/var/log/app:ro
    environment:
      - SERVICE_NAME=order-service
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_AGGREGATOR_URL=${LOG_AGGREGATOR_URL}
    depends_on:
      order-service:
        condition: service_healthy

  order-metrics-sidecar:
    build: ./metrics-sidecar
    container_name: order-metrics-sidecar
    ports:
      - "9103:9100"
    environment:
      - APP_METRICS_URL=http://order-service:3003/metrics
      - SERVICE_NAME=order-service
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=9100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      order-service:
        condition: service_healthy

volumes:
  user_service_logs:
  product_service_logs:
  order_service_logs: